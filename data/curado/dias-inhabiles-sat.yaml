# Días inhábiles del SAT que se transcriben del DOF: los de la regla 2.1.6 de la RMF 2026
# (vacaciones). Los del primer párrafo del artículo 12 del CFF (1o. de enero, primer lunes de
# febrero, etc.) no se capturan: los calcula el núcleo por regla de 2026 a 2100, y `curar` los
# agrega a la lista publicada de los años que cubre este archivo. Los sábados y domingos fuera de
# un periodo de vacaciones no se listan (el calendario los agrega solo); dentro de un periodo se
# listan todos los días.
#
# Las vacaciones generales cuentan como días hábiles en los plazos para presentar declaraciones y
# pagar contribuciones (art. 12, segundo párrafo). El 2 y 3 de abril (regla 2.1.6, fracción II) se
# capturan también como vacaciones: en esos plazos cuentan como hábiles, que es el lado seguro
# para el contribuyente (el plazo vence antes, no después).
#
# El segundo periodo general de vacaciones de 2026 no se ha publicado: la lista de vacaciones
# está completa hasta el 30 de noviembre de 2026. Cuando se publique, se agregan sus días y se
# extiende la cobertura.
#
# En la carpeta generada, `calendario.json` declara la cobertura de la API (declaraciones_pagos
# hasta 2100, por la regla del art. 12), mientras `dias-inhabiles.json` solo trae los días de los
# años que cubre este archivo (hoy 2026).
dataset: dias-inhabiles.sat
cobertura:
  vacaciones: { desde: 2026-01-01, hasta: 2026-11-30 }
fuentes:
  rmf-2026-2.1.6-i:
    nombre: "Resolución Miscelánea Fiscal para 2026"
    url: https://dof.gob.mx/nota_detalle.php?codigo=5777217&fecha=28/12/2025
    fecha_publicacion: 2025-12-28
    fragmento: "2.1.6. Para los efectos del artículo 12, primer y segundo párrafos del CFF, se estará a lo siguiente: I. El segundo periodo general de vacaciones de 2025, comprende del 18 de diciembre de 2025 al 2 de enero de 2026."
    licencia: "Texto oficial publicado en el DOF; no es objeto de derecho de autor (LFDA art. 14, fracción VIII)"
    licencia_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LFDA.pdf
  rmf-2026-2.1.6-ii:
    nombre: "Resolución Miscelánea Fiscal para 2026"
    url: https://dof.gob.mx/nota_detalle.php?codigo=5777217&fecha=28/12/2025
    fecha_publicacion: 2025-12-28
    fragmento: "2.1.6. Para los efectos del artículo 12, primer y segundo párrafos del CFF, se estará a lo siguiente: [...] II. Son días inhábiles para el SAT el 2 y 3 de abril de 2026."
    licencia: "Texto oficial publicado en el DOF; no es objeto de derecho de autor (LFDA art. 14, fracción VIII)"
    licencia_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LFDA.pdf
  primera-rm-2026:
    nombre: "Primera Resolución de Modificaciones a la Resolución Miscelánea Fiscal para 2026"
    url: https://dof.gob.mx/nota_detalle.php?codigo=5793101&fecha=09/07/2026
    fecha_publicacion: 2026-07-09
    fragmento: "2.1.6. ... I. ... II. ... III. El primer periodo general de vacaciones de 2026, comprende del 20 al 31 de julio de 2026."
    licencia: "Texto oficial publicado en el DOF; no es objeto de derecho de autor (LFDA art. 14, fracción VIII)"
    licencia_url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LFDA.pdf
registros:
  # Regla 2.1.6, fracción I: cola del segundo periodo de 2025 (el 1 de enero ya es de descanso
  # por el art. 12 y no se repite).
  - { fecha: 2026-01-02, autoridad: sat, motivo: "Segundo periodo general de vacaciones de 2025", tipo: vacaciones, fuente: rmf-2026-2.1.6-i }
  # Regla 2.1.6, fracción II.
  - { fecha: 2026-04-02, autoridad: sat, motivo: "Día inhábil para el SAT", tipo: vacaciones, fuente: rmf-2026-2.1.6-ii }
  - { fecha: 2026-04-03, autoridad: sat, motivo: "Día inhábil para el SAT", tipo: vacaciones, fuente: rmf-2026-2.1.6-ii }
  # Regla 2.1.6, fracción III (Primera Resolución de Modificaciones): todo el periodo.
  - { fecha: 2026-07-20, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-21, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-22, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-23, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-24, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-25, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-26, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-27, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-28, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-29, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-30, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
  - { fecha: 2026-07-31, autoridad: sat, motivo: "Primer periodo general de vacaciones de 2026", tipo: vacaciones, fuente: primera-rm-2026 }
