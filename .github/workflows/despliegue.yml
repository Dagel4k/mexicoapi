name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Por rama: una corrida desde otra rama (que no despliega) no reemplaza a un despliegue de main
# que espera turno.
concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # workflow_dispatch deja elegir cualquier rama, pero solo main despliega: el job desplegar se
  # salta en las demás y este deja el aviso.
  aviso-rama:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Avisar que solo main despliega
        env:
          RAMA: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "::notice::El despliegue solo corre desde main; ${RAMA} no se despliega."

  desplegar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Con los secretos en este Environment y su regla de ramas (solo main), ninguna otra rama
    # los puede leer.
    environment: produccion
    steps:
      - name: Comprobar secretos de Cloudflare
        id: cf
        env:
          TIENE_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          echo "tiene_cf=${TIENE_CF}" >> "${GITHUB_OUTPUT}"
          if [ "${TIENE_CF}" != "true" ]; then
            echo "::notice::Faltan los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID; no se despliega. Ver ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operacion/cloudflare.md"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cf.outputs.tiene_cf == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.cf.outputs.tiene_cf == 'true'

      # Sin caché de pnpm: este job tiene el token de Cloudflare, y cualquier job de main puede
      # escribir en la caché de Actions (también uno que procesa datos externos, como generar en
      # datos.yml). Instalar desde el registro es más lento, pero no confía en esa caché.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cf.outputs.tiene_cf == 'true'
        with:
          node-version-file: .nvmrc

      # Solo el Worker y lo que necesita para construirse (el núcleo y el pipeline que arma
      # public/): el paquete mexicoapi no se despliega.
      - name: Instalar y compilar
        if: steps.cf.outputs.tiene_cf == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter "@mexicoapi/api..." build

      - name: Configurar staging
        id: conf_staging
        if: steps.cf.outputs.tiene_cf == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url="$(node apps/api/scripts/cloudflare.ts configurar --entorno staging --salida apps/api/wrangler.staging.json)"
          [[ "${url}" =~ ^https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev$ ]] || { echo "::error::URL inesperada: ${url}"; exit 1; }
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Desplegar a staging
        if: steps.cf.outputs.tiene_cf == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SALIDA_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd apps/api
          pnpm --filter @mexicoapi/api exec wrangler deploy --config wrangler.staging.json 2>&1 | tee "${SALIDA_DIR}/deploy-staging.txt"
          version="$(grep -m1 'Current Version ID:' "${SALIDA_DIR}/deploy-staging.txt" | sed 's/.*Current Version ID:[[:space:]]*//' || true)"
          echo "${version:-desconocida}" > "${SALIDA_DIR}/version-staging.txt"

      - name: Prueba de humo en staging
        id: humo_staging
        if: steps.cf.outputs.tiene_cf == 'true'
        env:
          URL_STAGING: ${{ steps.conf_staging.outputs.url }}
          SALIDA_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Un Worker recién desplegado o un subdominio nuevo tardan en propagarse: hasta 5
          # intentos, con esperas de 10, 20, 30 y 60 s entre ellos.
          esperas=(10 20 30 60)
          codigo=1
          for intento in 1 2 3 4 5; do
            codigo=0
            node apps/api/scripts/humo.ts "${URL_STAGING}" > "${SALIDA_DIR}/humo-staging.txt" 2>&1 || codigo=$?
            cat "${SALIDA_DIR}/humo-staging.txt"
            if [ "${codigo}" -eq 0 ]; then break; fi
            echo "Intento ${intento} de 5 fallido."
            if [ "${intento}" -lt 5 ]; then sleep "${esperas[intento - 1]}"; fi
          done
          exit "${codigo}"

      - name: Configurar producción
        id: conf_prod
        if: steps.cf.outputs.tiene_cf == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url="$(node apps/api/scripts/cloudflare.ts configurar --entorno produccion --salida apps/api/wrangler.produccion.json)"
          [[ "${url}" =~ ^https://[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev$ ]] || { echo "::error::URL inesperada: ${url}"; exit 1; }
          echo "url=${url}" >> "${GITHUB_OUTPUT}"

      # `subido` dice si producción cambió: el despliegue terminó bien o la salida de wrangler
      # muestra la versión subida aunque después algo fallara. Se escribe antes de salir con error.
      - name: Desplegar a producción
        id: deploy_prod
        if: steps.cf.outputs.tiene_cf == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SALIDA_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd apps/api
          salida="${SALIDA_DIR}/deploy-produccion.txt"
          codigo=0
          pnpm --filter @mexicoapi/api exec wrangler deploy --config wrangler.produccion.json 2>&1 | tee "${salida}" || codigo=$?
          version="$(grep -m1 'Current Version ID:' "${salida}" | sed 's/.*Current Version ID:[[:space:]]*//' || true)"
          echo "${version:-desconocida}" > "${SALIDA_DIR}/version-produccion.txt"
          subido=no
          if [ "${codigo}" -eq 0 ] || [ -n "${version}" ] || grep -Eq '(^|[[:space:]])Uploaded mexicoapi \(' "${salida}"; then
            subido=si
          fi
          echo "subido=${subido}" >> "${GITHUB_OUTPUT}"
          if [ "${codigo}" -ne 0 ]; then
            if [ "${subido}" = "si" ]; then
              echo "::error::El despliegue a producción falló después de subir la versión; se corre el humo y, si falla, se revierte."
            else
              echo "::error::El despliegue a producción falló antes de subir una versión; producción no cambió."
            fi
            exit "${codigo}"
          fi

      # Solo si producción cambió, aunque el paso de despliegue haya fallado después de subir la
      # versión. Si staging falló, el despliegue a producción se saltó y esto no corre.
      - name: Prueba de humo en producción
        id: humo_prod
        if: always() && steps.cf.outputs.tiene_cf == 'true' && steps.humo_staging.outcome == 'success' && steps.deploy_prod.outputs.subido == 'si'
        env:
          URL_PROD: ${{ steps.conf_prod.outputs.url }}
          SALIDA_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # El humo fallido no aborta el paso: el rollback del siguiente paso necesita el resultado.
          # Un Worker recién desplegado tarda en propagarse: hasta 5 intentos, con esperas de 10,
          # 20, 30 y 60 s entre ellos.
          esperas=(10 20 30 60)
          codigo=1
          for intento in 1 2 3 4 5; do
            codigo=0
            node apps/api/scripts/humo.ts "${URL_PROD}" > "${SALIDA_DIR}/humo-produccion.txt" 2>&1 || codigo=$?
            cat "${SALIDA_DIR}/humo-produccion.txt"
            if [ "${codigo}" -eq 0 ]; then break; fi
            echo "Intento ${intento} de 5 fallido."
            if [ "${intento}" -lt 5 ]; then sleep "${esperas[intento - 1]}"; fi
          done
          if [ "${codigo}" -eq 0 ]; then
            echo "ok=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ok=false" >> "${GITHUB_OUTPUT}"
          fi

      # En el primer despliegue no hay versión anterior y el rollback falla: el resumen lo dice.
      - name: Revertir producción
        id: rollback
        if: always() && steps.cf.outputs.tiene_cf == 'true' && steps.humo_prod.outputs.ok == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd apps/api
          if pnpm --filter @mexicoapi/api exec wrangler rollback --config wrangler.produccion.json --yes --message "humo fallido en ${GITHUB_SHA}"; then
            echo "revertido=si" >> "${GITHUB_OUTPUT}"
            echo "::error::La prueba de humo de producción falló; se revirtió a la versión anterior."
          else
            echo "revertido=no" >> "${GITHUB_OUTPUT}"
            echo "::error::No se pudo revertir; producción quedó con ${GITHUB_SHA}"
          fi
          exit 1

      - name: Resumen
        if: always() && steps.cf.outputs.tiene_cf == 'true'
        env:
          URL_STAGING: ${{ steps.conf_staging.outputs.url }}
          URL_PROD: ${{ steps.conf_prod.outputs.url }}
          REVERTIDO: ${{ steps.rollback.outputs.revertido }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          DEPLOY_PROD: ${{ steps.deploy_prod.outcome }}
          SUBIDO: ${{ steps.deploy_prod.outputs.subido }}
          SALIDA_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          {
            echo "## Despliegue"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Staging: ${URL_STAGING:-sin configurar} (versión: $(cat "${SALIDA_DIR}/version-staging.txt" 2>/dev/null || echo desconocida))"
            echo "- Producción: ${URL_PROD:-sin configurar} (versión: $(cat "${SALIDA_DIR}/version-produccion.txt" 2>/dev/null || echo desconocida))"
            if [ "${DEPLOY_PROD}" = "failure" ] && [ "${SUBIDO}" = "no" ]; then
              echo "- El despliegue a producción falló antes de subir una versión: producción no cambió."
            fi
            if [ "${REVERTIDO}" = "si" ]; then
              echo "- El humo de producción falló y producción se revirtió a la versión anterior."
            elif [ "${REVERTIDO}" = "no" ]; then
              echo "- El humo de producción falló y no se pudo revertir: producción quedó con \`${GITHUB_SHA}\`."
            elif [ -n "${ROLLBACK}" ] && [ "${ROLLBACK}" != "skipped" ]; then
              echo "- La reversión no terminó (resultado: ${ROLLBACK})."
            fi
            for entorno in staging produccion; do
              archivo="${SALIDA_DIR}/humo-${entorno}.txt"
              if [ -f "${archivo}" ]; then
                echo
                echo "### Humo en ${entorno}"
                echo
                echo '```'
                cat "${archivo}"
                echo '```'
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"
