name: Publicación

# Publica en npm el paquete de la etiqueta de un Release de GitHub: mexicoapi@X.Y.Z (packages/sdk)
# o mexicoapi-mcp@X.Y.Z (packages/mcp). Sin tokens: npm confía en este workflow (trusted
# publishing, por OIDC) y agrega la procedencia. Pasos y requisitos en
# docs/operacion/publicacion-npm.md.
on:
  release:
    types: [published]

permissions: {}

# Una corrida a la vez, de cualquier etiqueta: dos versiones no compiten por latest. La segunda
# espera a la primera en vez de cancelarla.
concurrency:
  group: publicacion
  cancel-in-progress: false

jobs:
  # Revisa el Release y arma el .tgz, sin permiso para publicar. Si el paquete todavía no existe en
  # npm, termina en verde con un aviso: la primera versión se publica a mano.
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    outputs:
      estado: ${{ steps.npm.outputs.estado }}
      nombre: ${{ steps.revisar.outputs.nombre }}
      version: ${{ steps.revisar.outputs.version }}
      sha256: ${{ steps.armar.outputs.sha256 }}
      node: ${{ steps.node.outputs.node-version }}
    steps:
      # Todo el historial: hace falta para saber si el commit ya está en main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Antes de correr cualquier cosa del repositorio: un commit que no está en main no se revisó y
      # podría traer otras revisiones. Solo git del runner, contra main recién traído de GitHub.
      - name: Revisar que el commit esté en main
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]; then
            echo "::error::La etiqueta ya no apunta al commit del Release (${GITHUB_SHA})."
            exit 1
          fi
          git fetch --no-tags --quiet "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error::El commit ${GITHUB_SHA} no está en main: solo se publica lo que ya se integró."
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Sin caché: lo que se publica no sale de algo que guardó otra corrida.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version-file: .nvmrc

      - name: Revisar la etiqueta, el package.json y el CHANGELOG.md
        id: revisar
        env:
          ETIQUETA: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "${PRERELEASE}" = "true" ]; then
            echo "::error::El Release está marcado como pre-release y por ahora no se publican pre-versiones."
            exit 1
          fi
          node packages/sdk/scripts/liberacion.ts revisar "${ETIQUETA}" | tee -a "${GITHUB_OUTPUT}"

      # El check que exige la protección de main (job verify de ci.yml), en este mismo commit.
      - name: Revisar que CI pasó en el commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=verify&per_page=100" \
            | node packages/sdk/scripts/liberacion.ts verify "${GITHUB_SHA}"

      # estado=publicable si el paquete existe y la versión es mayor que todas las publicadas;
      # estado=sin-paquete si npm responde 404. Falla si la versión ya está o npm no responde.
      - name: Consultar npm
        id: npm
        env:
          ETIQUETA: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node packages/sdk/scripts/liberacion.ts npm "${ETIQUETA}" | tee -a "${GITHUB_OUTPUT}"

      - name: Avisar que la primera versión se publica a mano
        if: steps.npm.outputs.estado == 'sin-paquete'
        env:
          NOMBRE: ${{ steps.revisar.outputs.nombre }}
          VERSION: ${{ steps.revisar.outputs.version }}
        run: |
          set -euo pipefail
          guia="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operacion/publicacion-npm.md"
          echo "::notice::${NOMBRE} todavía no existe en npm y no se publicó nada: la primera versión se publica a mano. Ver ${guia}"
          {
            echo "## ${NOMBRE}@${VERSION}: no se publicó"
            echo
            echo "${NOMBRE} todavía no existe en npm. La primera versión se publica a mano y después se configura el publicador de confianza: [publicacion-npm.md](${guia})."
          } >> "${GITHUB_STEP_SUMMARY}"

      # Solo el paquete y lo que usa (con sus devDependencies y las de la raíz, que compilan): el
      # .tgz no se arma en un workspace con dependencias que no necesita.
      - name: Instalar dependencias
        if: steps.npm.outputs.estado == 'publicable'
        env:
          NOMBRE: ${{ steps.revisar.outputs.nombre }}
        run: pnpm install --frozen-lockfile --filter "${NOMBRE}..."

      - name: Compilar
        if: steps.npm.outputs.estado == 'publicable'
        env:
          NOMBRE: ${{ steps.revisar.outputs.nombre }}
        run: pnpm --filter "${NOMBRE}..." build

      # Como en ci.yml: publicable.ts arma una carpeta sin devDependencies ni scripts y npm pack la
      # empaqueta. mexicoapi-mcp va con --publicar, que se niega si mexicoapi@<versión de
      # packages/sdk>, su piso, no está en npm. publicar sube este mismo .tgz y revisa su sha256.
      - name: Armar el paquete
        id: armar
        if: steps.npm.outputs.estado == 'publicable'
        env:
          NOMBRE: ${{ steps.revisar.outputs.nombre }}
          VERSION: ${{ steps.revisar.outputs.version }}
        run: |
          set -euo pipefail
          destino="${RUNNER_TEMP}/publicable"
          if [ "${NOMBRE}" = "mexicoapi-mcp" ]; then
            node packages/mcp/scripts/publicable.ts --publicar "${destino}"
          else
            node packages/sdk/scripts/publicable.ts "${destino}"
          fi
          mkdir -p "${RUNNER_TEMP}/paquete"
          cd "${destino}"
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/paquete"
          tgz="${RUNNER_TEMP}/paquete/${NOMBRE}-${VERSION}.tgz"
          sha256="$(sha256sum "${tgz}" | cut -d " " -f 1)"
          echo "sha256=${sha256}" | tee -a "${GITHUB_OUTPUT}"
          {
            echo "## ${NOMBRE}@${VERSION}: listo para publicar"
            echo
            echo "${NOMBRE}-${VERSION}.tgz, sha256 ${sha256}. Contenido:"
            echo
            echo "~~~text"
            tar -tzvf "${tgz}"
            echo "~~~"
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.npm.outputs.estado == 'publicable'
        with:
          name: paquete
          path: ${{ runner.temp }}/paquete
          if-no-files-found: error
          retention-days: 1

  # Lo único que puede publicar: el Environment npm (solo etiquetas mexicoapi@* y mexicoapi-mcp@*)
  # e id-token para el OIDC de npm. No hace checkout ni compila: publica el .tgz de preparar.
  publicar:
    needs: preparar
    if: needs.preparar.outputs.estado == 'publicable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.preparar.outputs.nombre }}/v/${{ needs.preparar.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      # El mismo Node que preparar (el de .nvmrc).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.preparar.outputs.node }}

      - name: Revisar la versión de npm
        run: |
          set -euo pipefail
          actual="$(npm --version)"
          minima="11.5.1"
          if [ "$(printf '%s\n%s\n' "${minima}" "${actual}" | sort -V | head -n 1)" != "${minima}" ]; then
            echo "::error::npm ${actual} no publica con trusted publishing: hace falta ${minima} o posterior."
            exit 1
          fi
          echo "npm ${actual}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete
          path: ${{ runner.temp }}/paquete

      # Publica el .tgz que revisó preparar: mismo sha256, solo archivos comunes de la lista de
      # files (dist, README.md, CHANGELOG.md, LICENSE) y el package.json, y en este el paquete y la
      # versión del Release, sin scripts ni publishConfig (que podría cambiar el registro o la
      # etiqueta de npm), sin dependencias empaquetadas y con cada dependencia como rango de semver.
      - name: Publicar en npm con procedencia
        id: publicar
        env:
          NOMBRE: ${{ needs.preparar.outputs.nombre }}
          VERSION: ${{ needs.preparar.outputs.version }}
          SHA256: ${{ needs.preparar.outputs.sha256 }}
        run: |
          set -euo pipefail
          tgz="${RUNNER_TEMP}/paquete/${NOMBRE}-${VERSION}.tgz"
          echo "${SHA256}  ${tgz}" | sha256sum -c -
          tar -tvzf "${tgz}" > "${RUNNER_TEMP}/tipos-tgz"
          if grep -qv '^-' "${RUNNER_TEMP}/tipos-tgz"; then
            echo "::error::El .tgz trae algo que no es un archivo común (un directorio, un enlace o un dispositivo)."
            exit 1
          fi
          tar -tzf "${tgz}" > "${RUNNER_TEMP}/rutas-tgz"
          mal=0
          while IFS= read -r ruta || [ -n "${ruta}" ]; do
            case "${ruta}" in
              package/package.json | package/README.md | package/CHANGELOG.md | package/LICENSE) ;;
              package/dist/*)
                case "/${ruta}/" in
                  */./* | */../* | *//*)
                    printf '::error::Ruta no permitida en el .tgz: %q\n' "${ruta}"
                    mal=1
                    ;;
                esac
                ;;
              *)
                printf '::error::El .tgz trae un archivo fuera de la lista: %q\n' "${ruta}"
                mal=1
                ;;
            esac
          done < "${RUNNER_TEMP}/rutas-tgz"
          if [ "${mal}" -ne 0 ]; then
            exit 1
          fi
          paquete="$(tar -xzOf "${tgz}" package/package.json | node -e '
            const m = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            const falla = (texto) => {
              console.error("::error::El package.json del .tgz " + texto + " y no se publica.");
              process.exit(1);
            };
            for (const campo of ["scripts", "publishConfig", "bundleDependencies", "bundledDependencies"]) {
              if (m[campo] !== undefined) falla("trae " + campo);
            }
            // Cada dependencia, un rango de semver: nada de URL, git:, npm:, file:, link:,
            // workspace: ni etiquetas (latest, next).
            const version = /^(?:[~^]|[<>]=?|=)?v?(?:0|[1-9][0-9]*|[xX*])(?:\.(?:0|[1-9][0-9]*|[xX*])){0,2}(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
            const esRango = (r) => typeof r === "string" && r.split("||").every((parte) => {
              const piezas = parte.trim().split(/\s+/);
              return piezas[0] !== "" && piezas.every((x, i) => version.test(x) || (x === "-" && i === 1 && piezas.length === 3));
            });
            for (const campo of ["dependencies", "peerDependencies", "optionalDependencies", "devDependencies"]) {
              const deps = m[campo];
              if (deps === undefined) continue;
              if (typeof deps !== "object" || deps === null || Array.isArray(deps)) falla("trae " + campo + " que no es un objeto");
              for (const [nombre, rango] of Object.entries(deps)) {
                if (!esRango(rango)) falla("trae en " + campo + " una dependencia que no es un rango de semver (" + nombre + ")");
              }
            }
            console.log(m.name + "@" + m.version);
          ')"
          if [ "${paquete}" != "${NOMBRE}@${VERSION}" ]; then
            echo "::error::El .tgz es de ${paquete} y el Release, de ${NOMBRE}@${VERSION}."
            exit 1
          fi
          npm publish "${tgz}" --ignore-scripts --provenance --access public
          {
            echo "## ${NOMBRE}@${VERSION} publicado"
            echo
            echo "Con procedencia, desde este workflow: https://www.npmjs.com/package/${NOMBRE}/v/${VERSION}"
          } >> "${GITHUB_STEP_SUMMARY}"

      # npm no deja saber antes si el paquete confía en este workflow: si no, npm publish falla.
      - name: Explicar el fallo
        if: failure() && steps.publicar.outcome == 'failure'
        run: |
          set -euo pipefail
          guia="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operacion/publicacion-npm.md"
          echo "::error::npm publish falló. Con E403, E404, ENEEDAUTH, un error de OIDC o una acción no permitida, revisa el publicador de confianza del paquete en npmjs.com (y que permita npm publish). Ver ${guia}"
          {
            echo "## npm publish falló"
            echo
            echo "Con E403, E404, ENEEDAUTH, un error de OIDC o un aviso de acción no permitida, lo más probable es que el paquete no confíe en este workflow o no le permita npm publish: revisa su publicador de confianza en npmjs.com (usuario, repositorio, publicacion.yml, el Environment npm y, en Allowed actions, npm publish) en [publicacion-npm.md](${guia})."
          } >> "${GITHUB_STEP_SUMMARY}"
