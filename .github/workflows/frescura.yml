name: Frescura

on:
  schedule:
    - cron: "0 19 * * *" # diario 13:00 CDMX
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frescura
  cancel-in-progress: false

env:
  # Una cobertura de los datos curados se avisa cuando termina en estos días o menos.
  DIAS_AVISO: "30"

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Revisar frescura de los datos
        env:
          API_URL: ${{ vars.API_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL}" ]; then
            echo "::notice::Falta la variable de repositorio API_URL; no se revisa la frescura. Ver ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operacion/cloudflare.md"
            exit 0
          fi

          url_corrida="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          estado="${RUNNER_TEMP}/status.json"
          resumen="${GITHUB_STEP_SUMMARY:-/dev/null}"

          # Número del issue abierto con el título exacto, o vacío. Solo cuentan los que abrió
          # este workflow (github-actions): uno con ese título de otra cuenta no. Si la búsqueda
          # falla, devuelve error: llamada con `|| …`, errexit no corre dentro de la función.
          buscar_abierto() {
            local titulo="$1"
            gh issue list --state open --limit 100 --author app/github-actions \
              --search "in:title \"${titulo}\"" --json number,title \
              | jq -r --arg t "${titulo}" '[.[] | select(.title == $t)][0].number // empty'
          }

          # Abre un issue con el título exacto o, si ya hay uno abierto, comenta en él.
          # Sin sustituir la búsqueda por `|| true`: si falla, no se crea nada para no duplicar.
          abrir_o_comentar() {
            local titulo="$1" cuerpo="$2" numero
            numero="$(buscar_abierto "${titulo}")" || return 1
            if [ -n "${numero}" ]; then
              gh issue comment "${numero}" --body-file "${cuerpo}"
            else
              gh issue create --title "${titulo}" --body-file "${cuerpo}"
            fi
          }

          # Comenta y cierra el issue abierto con ese título, si existe.
          cerrar_si_abierto() {
            local titulo="$1" cuerpo="$2" numero
            numero="$(buscar_abierto "${titulo}")" || return 1
            if [ -n "${numero}" ]; then
              gh issue comment "${numero}" --body-file "${cuerpo}"
              gh issue close "${numero}"
            fi
          }

          base="${API_URL%/}"
          if ! curl -fsS --max-time 20 "${base}/v1/status" -o "${estado}" \
            || ! jq -e '.data | type == "array"' "${estado}" > /dev/null; then
            cuerpo="${RUNNER_TEMP}/issue-api.md"
            {
              echo "No hubo una respuesta válida de \`${base}/v1/status\`."
              echo
              echo "Corrida: ${url_corrida}"
            } > "${cuerpo}"
            abrir_o_comentar "API sin respuesta" "${cuerpo}"
            echo "::error::La API no respondió con un estado válido."
            exit 1
          fi

          cuerpo="${RUNNER_TEMP}/cierre-api.md"
          {
            echo "La API volvió a responder en \`/v1/status\`."
            echo
            echo "Corrida: ${url_corrida}"
          } > "${cuerpo}"
          cerrar_si_abierto "API sin respuesta" "${cuerpo}" \
            || echo "::warning::No se pudo revisar si hay un issue de API sin respuesta."

          {
            echo "## Frescura de los datos"
            echo
            echo "| Dataset | Estado | Datos al | Horas |"
            echo "| --- | --- | --- | --- |"
            jq -r '.data[] | "| \(.dataset) | \(.status) | \(.as_of // "-") | \(.frescura_horas // "-") |"' "${estado}"
          } >> "${resumen}"

          if jq -e 'any(.data[]; .status == "unknown")' "${estado}" > /dev/null; then
            echo "::notice::Hay datasets en estado unknown: la API aún no tiene estado operativo (KV sin configurar). No se abre ningún issue por ellos."
            echo >> "${resumen}"
            echo "Los datasets en estado unknown no se consideran desactualizados." >> "${resumen}"
          fi

          fallos=0
          # Un dataset por línea: nombre, estado, as_of, last_success, frescura_horas.
          while IFS=$'\t' read -r dataset status as_of ultimo horas <&3; do
            if ! [[ "${dataset}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::warning::Nombre de dataset no válido, se omite: ${dataset}"
              continue
            fi
            titulo="Datos desactualizados: ${dataset}"
            case "${status}" in
              ok)
                cuerpo="${RUNNER_TEMP}/cierre-${dataset}.md"
                {
                  echo "\`${dataset}\` volvió a estar al día (datos al ${as_of})."
                  echo
                  echo "Corrida: ${url_corrida}"
                } > "${cuerpo}"
                cerrar_si_abierto "${titulo}" "${cuerpo}" \
                  || { echo "::warning::No se pudo revisar el issue de ${dataset}."; fallos=$((fallos + 1)); }
                ;;
              unknown)
                ;;
              *)
                cuerpo="${RUNNER_TEMP}/issue-${dataset}.md"
                {
                  echo "\`${dataset}\` está desactualizado (estado: \`${status}\`)."
                  echo
                  echo "- Datos al: ${as_of}"
                  echo "- Último éxito: ${ultimo}"
                  echo "- Horas sin actualizar: ${horas}"
                  echo
                  echo "Corrida: ${url_corrida}"
                } > "${cuerpo}"
                abrir_o_comentar "${titulo}" "${cuerpo}" \
                  || { echo "::warning::No se pudo abrir el issue de ${dataset}."; fallos=$((fallos + 1)); }
                ;;
            esac
          done 3< <(jq -r '.data[] | [.dataset, .status, (.as_of // "desconocido"), (.last_success // "nunca"), (.frescura_horas // "desconocido")] | map(tostring) | @tsv' "${estado}")

          if [ "${fallos}" -gt 0 ]; then
            echo "::error::No se pudo gestionar el issue de ${fallos} dataset(s)."
            exit 1
          fi

  # Coberturas de los datos curados (los plazos de los calendarios de la CNBV y el SAT, la vigencia
  # de la última UMA y el último año del salario mínimo y de las tarifas de ISR) que terminan en
  # DIAS_AVISO días o menos, o que ya terminaron. Va en dos jobs: el que instala y corre el
  # pipeline no puede escribir, y el que abre los issues no instala ni corre nada del repositorio.
  # Solo desde main: una corrida a mano en otra rama abriría issues con los data/ de esa rama.
  coberturas:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      lista: ${{ steps.calcular.outputs.lista }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar y compilar
        run: |
          set -euo pipefail
          # Solo el pipeline y lo que usa (el núcleo).
          pnpm install --frozen-lockfile --filter "@mexicoapi/pipeline..."
          pnpm --filter "@mexicoapi/pipeline..." build

      - name: Calcular coberturas por vencer
        id: calcular
        run: |
          set -euo pipefail
          resumen="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # Lee solo data/ del repositorio; la fecha es la civil de la Ciudad de México.
          lista="$(node packages/pipeline/dist/bin.js coberturas --dias "${DIAS_AVISO}" --json)"
          {
            echo "## Coberturas de los datos curados"
            echo
            echo "Se abre un issue por cada una que termine en ${DIAS_AVISO} días o menos."
            echo
            echo "| Cobertura | Hasta | Días que faltan |"
            echo "| --- | --- | --- |"
            node packages/pipeline/dist/bin.js coberturas --json \
              | jq -r '.[] | "| \(.id) | \(.hasta) | \(.dias_restantes) |"'
          } >> "${resumen}"
          # En una sola línea: un JSON compacto no lleva saltos de línea. Si no es un arreglo, el
          # paso falla (la asignación lleva el código de jq; dentro del echo se perdería).
          compacta="$(jq -ce 'if type == "array" then . else error("no es un arreglo") end' <<< "${lista}")"
          echo "lista=${compacta}" >> "${GITHUB_OUTPUT}"

  avisar-coberturas:
    needs: coberturas
    if: github.ref == 'refs/heads/main' && needs.coberturas.outputs.lista != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir o actualizar un issue por cobertura
        env:
          LISTA: ${{ needs.coberturas.outputs.lista }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url_corrida="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          procedimiento="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operacion/datos-curados.md"

          # Número del issue abierto con el título exacto, o vacío. Solo cuentan los que abrió
          # este workflow (github-actions): uno con ese título de otra cuenta no. Si la búsqueda
          # falla, devuelve error: llamada con `|| …`, errexit no corre dentro de la función.
          buscar_abierto() {
            local titulo="$1"
            gh issue list --state open --limit 100 --author app/github-actions \
              --search "in:title \"${titulo}\"" --json number,title \
              | jq -r --arg t "${titulo}" '[.[] | select(.title == $t)][0].number // empty'
          }

          # Un issue por cobertura, con el título exacto. Si ya hay uno abierto, se reescribe su
          # descripción con los días que faltan, sin un comentario por día. Ninguno se cierra
          # solo: lo cierra quien integra la publicación nueva.
          # Una falla de jq dentro de `< <(…)` no detiene el script: la forma se revisa antes.
          if ! jq -e 'type == "array" and all(.[]; type == "object" and ([.id, .titulo, .resumen, .detalle] | all(type == "string")))' <<< "${LISTA}" > /dev/null; then
            echo "::error::La lista de coberturas no es un arreglo JSON con id, titulo, resumen y detalle."
            exit 1
          fi

          patron='^Cobertura por vencer: [a-z0-9.-]+( [a-z_]+)?$'
          fallos=0
          while IFS=$'\t' read -r id titulo texto detalle <&3; do
            if ! [[ "${titulo}" =~ ${patron} ]] || [ "${titulo}" != "Cobertura por vencer: ${id}" ]; then
              echo "::warning::Cobertura con un nombre no válido, se omite: ${id}"
              continue
            fi
            cuerpo="${RUNNER_TEMP}/cobertura.md"
            {
              echo "${texto}"
              echo
              echo "${detalle}"
              echo
              echo "Procedimiento: ${procedimiento}"
              echo
              echo "Este issue se actualiza cada día mientras la cobertura termine en ${DIAS_AVISO} días o menos y no se cierra solo: ciérralo al integrar la publicación nueva."
              echo
              echo "Corrida: ${url_corrida}"
            } > "${cuerpo}"
            # Sin sustituir la búsqueda por `|| true`: si falla, no se crea nada para no duplicar.
            if ! numero="$(buscar_abierto "${titulo}")"; then
              echo "::warning::No se pudo buscar el issue de ${id}."
              fallos=$((fallos + 1))
              continue
            fi
            if [ -n "${numero}" ]; then
              gh issue edit "${numero}" --body-file "${cuerpo}" \
                || { echo "::warning::No se pudo actualizar el issue de ${id}."; fallos=$((fallos + 1)); }
            else
              gh issue create --title "${titulo}" --body-file "${cuerpo}" \
                || { echo "::warning::No se pudo abrir el issue de ${id}."; fallos=$((fallos + 1)); }
            fi
          done 3< <(jq -r '.[] | [.id, .titulo, .resumen, .detalle] | @tsv' <<< "${LISTA}")

          if [ "${fallos}" -gt 0 ]; then
            echo "::error::No se pudo gestionar el issue de ${fallos} cobertura(s)."
            exit 1
          fi

  # Vigía del DOF: lee el índice del SIDOF del día (la fecha de la Ciudad de México) y abre un
  # issue por cada publicación cuyo título coincide con una captura pendiente de data/curado/ (la
  # RMF y sus modificaciones, las disposiciones de la CNBV, el salario mínimo, la UMA y el Anexo 8).
  # No captura nada. Si el SIDOF no responde, solo deja un aviso. Va en dos jobs, como la alerta de
  # coberturas: el que lee el SIDOF no puede escribir, y el que abre los issues no instala ni corre
  # nada del repositorio. Solo desde main.
  dof:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      lista: ${{ steps.buscar.outputs.lista }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar y compilar
        run: |
          set -euo pipefail
          # Solo el pipeline y lo que usa (el núcleo).
          pnpm install --frozen-lockfile --filter "@mexicoapi/pipeline..."
          pnpm --filter "@mexicoapi/pipeline..." build

      - name: Buscar publicaciones en el DOF
        id: buscar
        run: |
          set -euo pipefail
          resumen="${GITHUB_STEP_SUMMARY:-/dev/null}"
          salida="${RUNNER_TEMP}/dof.json"
          # Pide solo el índice del día al SIDOF, con el cliente del pipeline. Sus errores pueden
          # traer textos de la respuesta: mientras corre, el runner no interpreta comandos de
          # workflow (líneas que empiezan con ::).
          codigo=0
          pausa="$(openssl rand -hex 16)"
          echo "::stop-commands::${pausa}"
          node packages/pipeline/dist/bin.js dof --json > "${salida}" || codigo=$?
          echo "::${pausa}::"
          if [ "${codigo}" -ne 0 ]; then
            echo "::error::El índice del SIDOF no tiene la forma esperada; ver el log del paso."
            exit 1
          fi
          if ! jq -e '.revisado == true' "${salida}" > /dev/null; then
            echo "::warning::El SIDOF no respondió: hoy no se revisó el DOF. Ver el log del paso."
          fi
          # En una sola línea: un JSON compacto no lleva saltos de línea. Si no es un arreglo, el
          # paso falla (la asignación lleva el código de jq; dentro del echo se perdería).
          lista="$(jq -ce '.publicaciones | if type == "array" then . else error("no es un arreglo") end' "${salida}")"
          {
            echo "## Vigía del DOF"
            echo
            jq -r 'if .revisado then "Índice del SIDOF del \(.fecha): \(.notas) notas, \(.publicaciones | length) por capturar." else "El SIDOF no respondió: no se revisó el índice del \(.fecha)." end' "${salida}"
          } >> "${resumen}"
          echo "lista=${lista}" >> "${GITHUB_OUTPUT}"

  avisar-dof:
    needs: dof
    if: github.ref == 'refs/heads/main' && needs.dof.outputs.lista != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir un issue por publicación
        env:
          LISTA: ${{ needs.dof.outputs.lista }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url_corrida="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          procedimiento="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operacion/datos-curados.md"

          # Número del issue con el título exacto, abierto o cerrado, o vacío. Solo cuentan los que
          # abrió este workflow (github-actions). Uno cerrado también cuenta: un aviso que alguien
          # cerró no se vuelve a abrir. Si la búsqueda falla, devuelve error: llamada con `|| …`,
          # errexit no corre dentro de la función.
          buscar_cualquiera() {
            local titulo="$1"
            gh issue list --state all --limit 100 --author app/github-actions \
              --search "in:title \"${titulo}\"" --json number,title \
              | jq -r --arg t "${titulo}" '[.[] | select(.title == $t)][0].number // empty'
          }

          # La lista viene de un job que leyó el SIDOF: su forma se revisa antes del bucle (una
          # falla de jq dentro de `< <(…)` no detiene el script) y cada publicación dentro de él.
          if ! jq -e 'type == "array" and all(.[]; type == "object" and ([.codigo, .titulo, .publicacion, .edicion, .fecha, .url] | all(type == "string")) and (.archivos | type == "array" and all(.[]; type == "string")))' <<< "${LISTA}" > /dev/null; then
            echo "::error::La lista del DOF no es un arreglo JSON con codigo, titulo, publicacion, edicion, fecha, url y archivos."
            exit 1
          fi

          patron='^Publicación en el DOF: [0-9]{1,12} \([a-z0-9-]+\)$'
          patron_archivos='^data/curado/[a-z0-9-]+\.yaml(, data/curado/[a-z0-9-]+\.yaml)*$'
          fallos=0
          while IFS=$'\t' read -r codigo titulo edicion fecha url archivos <&3; do
            if ! [[ "${codigo}" =~ ^[0-9]{1,12}$ ]] || ! [[ "${titulo}" =~ ${patron} ]] \
              || [[ "${titulo}" != "Publicación en el DOF: ${codigo} ("* ]] \
              || [ "${url}" != "https://sidof.segob.gob.mx/notas/docFuente/${codigo}" ] \
              || ! [[ "${edicion}" =~ ^(matutina|vespertina|extraordinaria)$ ]] \
              || ! [[ "${fecha}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] \
              || ! [[ "${archivos}" =~ ${patron_archivos} ]]; then
              echo "::warning::Una publicación del DOF trae datos no válidos, se omite."
              continue
            fi
            # El título de la nota viene del SIDOF: va en un bloque de código, en una línea, sin
            # acentos graves (ninguno puede cerrar el bloque) y con un tope de largo.
            publicacion="$(jq -r --arg c "${codigo}" 'first(.[] | select(.codigo == $c)) | .publicacion | gsub("[[:cntrl:]\u2028\u2029]+"; " ") | gsub("`+"; "\u0027") | .[0:500]' <<< "${LISTA}")"
            cuerpo="${RUNNER_TEMP}/dof-${codigo}.md"
            {
              echo "El DOF del ${fecha} (edición ${edicion}) trae una publicación que puede ser una de las capturas pendientes de \`data/curado/\`:"
              echo
              echo '```text'
              echo "${publicacion}"
              echo '```'
              echo
              echo "- Texto en el SIDOF: ${url}"
              echo "- Puede traer datos para: ${archivos}"
              echo
              echo "Este aviso no captura nada. Si la publicación trae los datos, captúralos con el procedimiento de ${procedimiento} y cierra este issue al integrar el PR; si no los trae, ciérralo. No se vuelve a abrir."
              echo
              echo "Corrida: ${url_corrida}"
            } > "${cuerpo}"
            # Sin sustituir la búsqueda por `|| true`: si falla, no se crea nada para no duplicar.
            if ! numero="$(buscar_cualquiera "${titulo}")"; then
              echo "::warning::No se pudo buscar el issue de la publicación ${codigo}."
              fallos=$((fallos + 1))
              continue
            fi
            if [ -n "${numero}" ]; then
              echo "La publicación ${codigo} ya tiene su issue (#${numero}): no se abre otro."
            else
              gh issue create --title "${titulo}" --body-file "${cuerpo}" \
                || { echo "::warning::No se pudo abrir el issue de la publicación ${codigo}."; fallos=$((fallos + 1)); }
            fi
          done 3< <(jq -r '.[] | [.codigo, .titulo, .edicion, .fecha, .url, (.archivos | join(", "))] | @tsv' <<< "${LISTA}")

          if [ "${fallos}" -gt 0 ]; then
            echo "::error::No se pudo gestionar el issue de ${fallos} publicación(es) del DOF."
            exit 1
          fi
