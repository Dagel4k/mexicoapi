name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verificacion:
    name: verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, del archivo de checksums oficial del release.
      # Si cambia la versión, hay que cambiar también este valor.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      # SHA-256 de actionlint_1.7.12_linux_amd64.tar.gz, del archivo de checksums oficial del release.
      # Si cambia la versión, hay que cambiar también este valor.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL -o "${dir}/${tarball}" "${base}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${dir}/${tarball}" -C "${HOME}/.local/bin" gitleaks
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Instalar actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL -o "${dir}/${tarball}" "${base}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${dir}/${tarball}" -C "${HOME}/.local/bin" actionlint
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Revisar workflows
        run: actionlint

      - name: Verificar
        run: ./scripts/verify.sh

  # Empaqueta mexicoapi una vez, con el Node de .nvmrc, para probar el mismo .tgz en cada versión.
  paquete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar mexicoapi y el núcleo
        run: pnpm --filter "mexicoapi..." build

      # Como se publica: npm pack en la carpeta que arma publicable.ts, sin devDependencies ni scripts.
      - name: Empaquetar
        run: |
          set -euo pipefail
          node packages/sdk/scripts/publicable.ts "${RUNNER_TEMP}/publicable"
          mkdir -p "${RUNNER_TEMP}/tgz"
          cd "${RUNNER_TEMP}/publicable"
          npm pack --pack-destination "${RUNNER_TEMP}/tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquete-mexicoapi
          path: ${{ runner.temp }}/tgz/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Instala el .tgz en un proyecto nuevo y corre la prueba de humo (sin Vitest) en cada línea de
  # Node que soporta el paquete. Versiones exactas: la última de cada línea al fijarlas. Con 20.19+
  # y 22.12+ la prueba también carga el paquete con require().
  paquete-node:
    name: paquete en Node ${{ matrix.node }}
    needs: paquete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["20.20.2", "22.23.3", "24.21.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete-mexicoapi
          path: ${{ runner.temp }}/tgz

      - name: Instalar el paquete y probarlo
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp packages/sdk/test/paquete/humo.mjs "${dir}/"
          cd "${dir}"
          printf '{"name":"consumidor","private":true,"type":"module"}\n' > package.json
          npm install --no-audit --no-fund --no-package-lock --ignore-scripts "${RUNNER_TEMP}"/tgz/mexicoapi-*.tgz
          node humo.mjs

  # El check que exige la protección de main. Pasa solo si la verificación, el empaquetado y cada
  # Node de la matriz terminaron bien: con always() corre aunque alguno falle, se salte o se
  # cancele, y en ese caso falla en vez de quedar saltado (un check saltado cuenta como aprobado).
  verify:
    name: verify
    if: always()
    needs: [verificacion, paquete, paquete-node]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Revisar los jobs requeridos
        env:
          VERIFICACION: ${{ needs.verificacion.result }}
          PAQUETE: ${{ needs.paquete.result }}
          PAQUETE_NODE: ${{ needs.paquete-node.result }}
        run: |
          set -euo pipefail
          falla=0
          for par in "verificacion=${VERIFICACION}" "paquete=${PAQUETE}" "paquete-node=${PAQUETE_NODE}"; do
            echo "${par}"
            if [ "${par#*=}" != "success" ]; then
              falla=1
            fi
          done
          exit "${falla}"
