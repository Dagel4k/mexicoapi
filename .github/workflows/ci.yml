name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ningún job usa la caché de pnpm: la caché de Actions de main la puede escribir cualquier corrida
# en main, también los jobs que procesan datos externos (generar en datos.yml, coberturas en
# frescura.yml), y un paquete alterado ahí podría dejar verify en verde. Instalar del registro
# cuesta unos segundos por job.
jobs:
  verificacion:
    name: verificacion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 de gitleaks_8.30.1_linux_x64.tar.gz, del archivo de checksums oficial del release.
      # Si cambia la versión, hay que cambiar también este valor.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: 1.7.12
      # SHA-256 de actionlint_1.7.12_linux_amd64.tar.gz, del archivo de checksums oficial del release.
      # Si cambia la versión, hay que cambiar también este valor.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL -o "${dir}/${tarball}" "${base}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${dir}/${tarball}" -C "${HOME}/.local/bin" gitleaks
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Instalar actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL -o "${dir}/${tarball}" "${base}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${dir}/${tarball}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${dir}/${tarball}" -C "${HOME}/.local/bin" actionlint
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Revisar workflows
        run: actionlint

      - name: Verificar
        run: ./scripts/verify.sh

  # Empaqueta mexicoapi una vez, con el Node de .nvmrc, para probar el mismo .tgz en cada versión.
  paquete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar mexicoapi y el núcleo
        run: pnpm --filter "mexicoapi..." build

      # Como se publica: npm pack en la carpeta que arma publicable.ts, sin devDependencies ni scripts.
      - name: Empaquetar
        run: |
          set -euo pipefail
          node packages/sdk/scripts/publicable.ts "${RUNNER_TEMP}/publicable"
          mkdir -p "${RUNNER_TEMP}/tgz"
          cd "${RUNNER_TEMP}/publicable"
          npm pack --pack-destination "${RUNNER_TEMP}/tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paquete-mexicoapi
          path: ${{ runner.temp }}/tgz/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Instala el .tgz en un proyecto nuevo y corre la prueba de humo (sin Vitest) en cada línea de
  # Node que soporta el paquete: 22.13.0, el piso de engines, y la última de cada línea con 7 días
  # o más al fijarlas. La prueba también carga el paquete con require() y usa node:sqlite.
  paquete-node:
    name: paquete en Node ${{ matrix.node }}
    needs: paquete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "22.23.3", "24.21.0", "26.11.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete-mexicoapi
          path: ${{ runner.temp }}/tgz

      # --offline: mexicoapi no tiene dependencias y el .tgz es local, así que npm no consulta el
      # registro. Con tiempo límite, un npm colgado no espera hasta el del job.
      - name: Instalar el paquete y probarlo
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp packages/sdk/test/paquete/humo.mjs "${dir}/"
          cd "${dir}"
          printf '{"name":"consumidor","private":true,"type":"module"}\n' > package.json
          npm install --offline --no-audit --no-fund --no-package-lock --ignore-scripts "${RUNNER_TEMP}"/tgz/mexicoapi-*.tgz
          node humo.mjs

  # El mismo .tgz fuera de Node: instalado con npm en un proyecto nuevo, Bun y Deno corren la prueba
  # de las entradas universales (universal.mjs, sin módulos de Node ni red) y esbuild empaqueta cada
  # entrada universal para el navegador (scripts/navegador.ts). Versiones exactas de Bun y Deno: la
  # última de cada uno con 7 días o más al fijarlas. esbuild es el del lockfile (el de wrangler).
  paquete-runtimes:
    name: paquete en Bun, Deno y navegador
    needs: paquete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
          no-cache: true

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      # Solo para esbuild: lo trae wrangler, devDependency de mexicoapi.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete-mexicoapi
          path: ${{ runner.temp }}/tgz

      - name: Instalar el paquete
        id: instalar
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp packages/sdk/test/paquete/universal.mjs "${dir}/"
          cd "${dir}"
          printf '{"name":"consumidor","private":true,"type":"module"}\n' > package.json
          npm install --offline --no-audit --no-fund --no-package-lock --ignore-scripts "${RUNNER_TEMP}"/tgz/mexicoapi-*.tgz
          echo "CONSUMIDOR=${dir}" >> "${GITHUB_ENV}"

      # --no-install: Bun no instala nada por su cuenta; usa el node_modules de npm.
      - name: Probar con Bun
        run: |
          cd "${CONSUMIDOR}"
          bun --no-install universal.mjs

      # Deno resuelve el paquete en el node_modules de npm por su `exports`, como en un proyecto
      # con package.json; sin permisos, falla si el paquete pidiera red, archivos o variables.
      - name: Probar con Deno
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: |
          cd "${CONSUMIDOR}"
          deno run --no-prompt --no-remote --node-modules-dir=manual universal.mjs

      - name: Empaquetar para el navegador
        if: ${{ !cancelled() && steps.instalar.outcome == 'success' }}
        run: node packages/sdk/scripts/navegador.ts "${CONSUMIDOR}"

  # El servidor MCP como lo instala quien lo usa: se arma con packages/mcp/scripts/publicable.ts
  # (la dependencia mexicoapi queda en ^<versión de packages/sdk>), se empaqueta con npm pack y se
  # instala con el .tgz de mexicoapi del job `paquete` en un proyecto nuevo. La prueba de humo (sin
  # Vitest ni dependencias) lanza el binario instalado y le habla por stdio. Se compila con el Node
  # de .nvmrc y se prueba con el de la matriz: 22.13.0, el piso de engines, y las mismas 22 y 24 de
  # paquete-node.
  paquete-mcp:
    name: mexicoapi-mcp en Node ${{ matrix.node }}
    needs: paquete
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "22.23.3", "24.21.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar mexicoapi-mcp, mexicoapi y el núcleo
        run: pnpm --filter "mexicoapi-mcp..." build

      - name: Empaquetar
        run: |
          set -euo pipefail
          node packages/mcp/scripts/publicable.ts "${RUNNER_TEMP}/publicable-mcp"
          mkdir -p "${RUNNER_TEMP}/tgz-mcp"
          cd "${RUNNER_TEMP}/publicable-mcp"
          npm pack --pack-destination "${RUNNER_TEMP}/tgz-mcp"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paquete-mexicoapi
          path: ${{ runner.temp }}/tgz

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # --offline: npm no consulta el registro, donde mexicoapi todavía no existe. La dependencia
      # mexicoapi@^<versión> del servidor la cumple el .tgz local que se instala en el mismo comando.
      - name: Instalar los dos paquetes y probarlos
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cp packages/mcp/test/paquete/humo.mjs "${dir}/"
          cd "${dir}"
          printf '{"name":"consumidor","private":true,"type":"module"}\n' > package.json
          npm install --offline --no-audit --no-fund --no-package-lock --ignore-scripts \
            "${RUNNER_TEMP}"/tgz/mexicoapi-*.tgz "${RUNNER_TEMP}"/tgz-mcp/mexicoapi-mcp-*.tgz
          node humo.mjs

  # Un PR del bot de datos solo puede tocar archivos comunes de las carpetas de sus datasets en
  # data/, y solo puede ir a main: el auto-merge lo fusiona sin revisión. Es del bot si su rama
  # empieza con datos/, si lo abrió una cuenta Bot que no es Dependabot (el nombre de la App no
  # está en el repo) o si el evento que disparó esta corrida (abrir, reabrir o hacer push) lo hizo
  # una de esas cuentas. Para los demás PRs y para los push a main pasa enseguida. Solo lee nombres
  # y modos de archivo del merge del PR, sin correr nada de él. La App no tiene el permiso
  # Workflows, así que no puede cambiar este archivo.
  #
  # Cambiar la base de un PR dispara el evento edited, que aquí no se escucha: también llega con
  # cada cambio de título o descripción, y correr toda la verificación en cada uno cuesta lo mismo
  # que un push. Saltar los jobs en esos casos no sirve: un verify saltado cuenta como aprobado y
  # reemplazaría a uno en rojo del mismo commit. En su lugar, un PR del bot con otra base falla
  # aquí; si después le cambian la base a main, ese rojo se queda en el commit hasta un push nuevo
  # o una reapertura, que vuelven a correr esta revisión contra main (la App no puede volver a
  # correr workflows).
  #
  # Esto depende de dos ajustes de la protección de main, que no son solo comodidad: "Require
  # branches to be up to date before merging" y el check verify requerido con origen GitHub
  # Actions; sin el primero, la App podría basar una rama datos/ en un commit viejo de main cuyo
  # ci.yml no tiene esta revisión de base, conseguir un verde, cambiar la base a main y fusionar.
  solo-datos:
    name: solo-datos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      es_bot: ${{ steps.bot.outputs.es_bot }}
    steps:
      - name: Ver si el PR es del bot de datos
        id: bot
        env:
          EVENTO: ${{ github.event_name }}
          RAMA: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          AUTOR: ${{ github.event.pull_request.user.login }}
          AUTOR_TIPO: ${{ github.event.pull_request.user.type }}
          EMISOR: ${{ github.event.sender.login }}
          EMISOR_TIPO: ${{ github.event.sender.type }}
        run: |
          set -euo pipefail
          es_bot=no
          if [ "${EVENTO}" = "pull_request" ]; then
            case "${RAMA}" in
              datos/*) es_bot=si ;;
            esac
            if [ "${AUTOR_TIPO}" = "Bot" ] && [ "${AUTOR}" != "dependabot[bot]" ]; then
              es_bot=si
            fi
            if [ "${EMISOR_TIPO}" = "Bot" ] && [ "${EMISOR}" != "dependabot[bot]" ]; then
              es_bot=si
            fi
          fi
          echo "es_bot=${es_bot}" >> "${GITHUB_OUTPUT}"
          if [ "${es_bot}" = "no" ]; then
            echo "No es un PR del bot de datos: no hay nada que revisar."
          elif [ "${BASE}" != "main" ]; then
            printf '::error::Un PR del bot de datos solo puede ir a main, no a %q.\n' "${BASE}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.bot.outputs.es_bot == 'si'
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Exigir que solo toque data/
        if: steps.bot.outputs.es_bot == 'si'
        env:
          # Las carpetas de los datasets del bot; una prueba del pipeline
          # (test/workflows.test.ts) las compara con el registro. data/curado/ nunca pasa por
          # el bot.
          CARPETAS: inegi-estados inegi-municipios bancos tipo-cambio-fix udis
        run: |
          set -euo pipefail
          export LC_ALL=C
          # Una ruta vale si está en una de esas carpetas, solo lleva letras ASCII, dígitos y
          # . _ / - (nada de espacios, controles ni saltos de línea), y ningún componente está
          # vacío ni empieza con punto (., .., .git, archivos ocultos). Es la misma regla de
          # publicar en datos.yml; una prueba del pipeline revisa que sean iguales. Las rutas
          # rechazadas salen escapadas con %q.
          patron="^data/(${CARPETAS// /|})/[A-Za-z0-9._/-]+$"
          ruta_valida() {
            [[ "$1" =~ ${patron} ]] || return 1
            case "/$1/" in
              */.* | *//*) return 1 ;;
            esac
          }
          # HEAD es el merge del PR con main y HEAD^1 la punta de main: su diferencia es lo que el
          # PR metería. --raw -z da el modo final y la ruta sin comillas; solo valen archivos
          # comunes (100644 o 100755) o borrados (000000).
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error::Se esperaba el commit de merge del PR."
            exit 1
          fi
          lista="${RUNNER_TEMP}/cambios-pr"
          git diff --raw --no-renames -z 'HEAD^1' HEAD > "${lista}"
          mal=0
          n=0
          while IFS= read -r -d '' meta && IFS= read -r -d '' ruta; do
            n=$((n + 1))
            modo="${meta#:* }"
            modo="${modo%% *}"
            if ! ruta_valida "${ruta}"; then
              printf '::error::El PR del bot toca una ruta no permitida: %q\n' "${ruta}"
              mal=1
            fi
            case "${modo}" in
              100644 | 100755 | 000000) ;;
              *) printf '::error::Modo no permitido (%s) en %q\n' "${modo}" "${ruta}"; mal=1 ;;
            esac
          done < "${lista}"
          echo "${n} archivos revisados."
          exit "${mal}"

  # Un PR del bot de datos sin la etiqueta revisar se fusiona solo, y quien decide si lleva la
  # etiqueta es generar (datos.yml), el job que procesa archivos de las fuentes. Este job no le
  # cree: con el código de main, el comando revisar del pipeline compara data/ de HEAD^1 (la punta
  # de main) con la de HEAD (el merge del PR) con las reglas de actualizar, y si los cambios piden
  # revisión y el PR no lleva la etiqueta, falla y verify queda en rojo. Corre después de
  # solo-datos, que ya comprobó que el PR solo toca data/ (así que el código del merge es el de
  # main), sin caché y sin secretos. Los avisos que generar saca de las fuentes (un banco del PDF
  # que no está en el CEP, por ejemplo) no se pueden repetir aquí; los umbrales, sí. La etiqueta se
  # lee de la API al final y no del evento: gh pr create la agrega justo después de abrir el PR.
  # Con la etiqueta no basta, porque quien tenga el token de la App puede ponerla y fusionar: además
  # hace falta una aprobación del commit actual de una persona con permiso de escritura. Después
  # de aprobar, "Re-run failed jobs" en esta misma corrida vuelve a leer las revisiones (la App no
  # tiene actions: write y no puede volver a correr nada). CI no escucha pull_request_review: en
  # ese evento el emisor es quien revisa, y una revisión de una cuenta Bot marcaría como del bot
  # el PR de una persona.
  revision-datos:
    name: revision-datos
    needs: solo-datos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Ver si es un PR del bot de datos
        if: needs.solo-datos.outputs.es_bot != 'si'
        run: echo "No es un PR del bot de datos, no hay nada que revisar."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.solo-datos.outputs.es_bot == 'si'
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.solo-datos.outputs.es_bot == 'si'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.solo-datos.outputs.es_bot == 'si'
        with:
          node-version-file: .nvmrc

      - name: Instalar y compilar el pipeline
        if: needs.solo-datos.outputs.es_bot == 'si'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter "@mexicoapi/pipeline..."
          pnpm --filter "@mexicoapi/pipeline..." build

      # 0: nada pide revisión; 3: algo la pide; cualquier otro código (un snapshot que no se puede
      # leer o no es válido) detiene el job.
      - name: Recalcular la revisión con el código de main
        id: revision
        if: needs.solo-datos.outputs.es_bot == 'si'
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet 'HEAD^2' > /dev/null; then
            echo "::error::Se esperaba el commit de merge del PR."
            exit 1
          fi
          antes="${RUNNER_TEMP}/antes"
          mkdir -p "${antes}"
          git archive --format=tar 'HEAD^1' data | tar -x -C "${antes}"
          codigo=0
          # Los motivos traen textos de los datos del PR: mientras corre, el runner no interpreta
          # comandos de workflow.
          pausa="$(openssl rand -hex 16)"
          echo "::stop-commands::${pausa}"
          node packages/pipeline/dist/bin.js revisar --antes "${antes}/data" || codigo=$?
          echo "::${pausa}::"
          echo "codigo=${codigo}" >> "${GITHUB_OUTPUT}"
          case "${codigo}" in
            0) echo "Los datos del PR no piden revisión." ;;
            3) echo "Los datos del PR piden revisión." ;;
            *) echo "::error::revisar terminó con el código ${codigo}."; exit 1 ;;
          esac

      - name: Exigir la etiqueta revisar y una aprobación
        if: steps.revision.outputs.codigo == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          etiquetada="$(gh pr view "${PR}" --json labels --jq '[.labels[].name] | index("revisar") != null')"
          if [ "${etiquetada}" != "true" ]; then
            echo "::error::Los datos del PR piden revisión y el PR no lleva la etiqueta revisar. Que generar no la pidiera es una señal de que algo anda mal: revisa su corrida antes que los datos (ver docs/operacion/bot-de-datos.md)."
            exit 1
          fi
          # La última revisión que decide (aprobar, pedir cambios o descartada) de cada persona, sin
          # cuentas Bot; vale si aprueba el commit actual.
          revisiones="${RUNNER_TEMP}/revisiones.json"
          gh api --paginate "repos/${GH_REPO}/pulls/${PR}/reviews?per_page=100" > "${revisiones}"
          aprobadores="$(jq -rs --arg sha "${CABEZA}" '
            add // []
            | map(select(.user.type != "Bot" and (.state | IN("APPROVED", "CHANGES_REQUESTED", "DISMISSED"))))
            | group_by(.user.login) | map(max_by(.id))
            | map(select(.state == "APPROVED" and .commit_id == $sha)) | .[].user.login' "${revisiones}")"
          aprobado=no
          while IFS= read -r usuario; do
            [[ "${usuario}" =~ ^[A-Za-z0-9-]+$ ]] || continue
            permiso="$(gh api "repos/${GH_REPO}/collaborators/${usuario}/permission" --jq .permission)"
            case "${permiso}" in
              admin | maintain | write)
                echo "Aprobado por ${usuario} (${permiso}) en ${CABEZA}."
                aprobado=si
                ;;
            esac
          done <<< "${aprobadores}"
          if [ "${aprobado}" != "si" ]; then
            echo "::error::Los datos del PR piden revisión: hace falta que una persona con permiso de escritura apruebe este commit (${CABEZA}). Después de aprobar, usa Re-run failed jobs en esta corrida."
            exit 1
          fi

  # El check que exige la protección de main. Pasa solo si la verificación, el empaquetado, cada
  # Node de las matrices, la prueba en Bun, Deno y navegador, la del servidor MCP y las dos
  # revisiones de los PRs del bot de datos terminaron bien: con always() corre aunque alguno falle,
  # se salte o se cancele, y en ese caso falla en vez de quedar saltado (un check saltado cuenta
  # como aprobado).
  verify:
    name: verify
    if: always()
    needs: [verificacion, paquete, paquete-node, paquete-runtimes, paquete-mcp, solo-datos, revision-datos]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Revisar los jobs requeridos
        env:
          VERIFICACION: ${{ needs.verificacion.result }}
          PAQUETE: ${{ needs.paquete.result }}
          PAQUETE_NODE: ${{ needs.paquete-node.result }}
          PAQUETE_RUNTIMES: ${{ needs.paquete-runtimes.result }}
          PAQUETE_MCP: ${{ needs.paquete-mcp.result }}
          SOLO_DATOS: ${{ needs.solo-datos.result }}
          REVISION_DATOS: ${{ needs.revision-datos.result }}
        run: |
          set -euo pipefail
          falla=0
          for par in "verificacion=${VERIFICACION}" "paquete=${PAQUETE}" "paquete-node=${PAQUETE_NODE}" "paquete-runtimes=${PAQUETE_RUNTIMES}" "paquete-mcp=${PAQUETE_MCP}" "solo-datos=${SOLO_DATOS}" "revision-datos=${REVISION_DATOS}"; do
            echo "${par}"
            if [ "${par#*=}" != "success" ]; then
              falla=1
            fi
          done
          exit "${falla}"
