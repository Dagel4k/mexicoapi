name: Datos

on:
  # GitHub retrasa las corridas programadas, sobre todo al inicio de cada hora: los crons van en
  # minutos poco usados, y la hora es la más temprana a la que corren, no la de llegada. Una
  # prueba del pipeline (test/workflows.test.ts) fija esta lista.
  schedule:
    - cron: "47 11 * * 1" # INEGI, lunes 05:47 CDMX
    - cron: "47 13 * * *" # bancos, diario 07:47 CDMX
    # FIX y UDIS van en grupos aparte: una falla de una serie no detiene la otra. Entre dos
    # corridas de FIX o UDIS hay una hora o más, para que sus PRs no compitan por estar al día
    # con main.
    - cron: "47 18 * * *" # FIX, diario 12:47 CDMX (sin horario de verano desde 2022)
    - cron: "17 20 * * *" # UDIS, diario 14:17 CDMX
    # Respaldo del FIX, por si la primera corrida no llegó o falló. Si main ya tiene los mismos
    # registros, no publica nada.
    - cron: "17 22 * * *" # FIX, diario 16:17 CDMX
  workflow_dispatch:
    inputs:
      dataset:
        description: Grupo de datos a actualizar
        type: choice
        options:
          - inegi
          - bancos
          - fix
          - udis
        default: inegi

permissions:
  contents: read

concurrency:
  group: datos-${{ github.event.inputs.dataset || (github.event.schedule == '47 11 * * 1' && 'inegi') || (github.event.schedule == '47 13 * * *' && 'bancos') || (github.event.schedule == '47 18 * * *' && 'fix') || (github.event.schedule == '17 20 * * *' && 'udis') || (github.event.schedule == '17 22 * * *' && 'fix') || 'otro' }}
  cancel-in-progress: false

# La corrida va en jobs separados para que la clave de la GitHub App no conviva con código de
# terceros (ver docs/operacion/bot-de-datos.md):
# - preparar elige el grupo y comprueba que existan los secretos del bot; no hace checkout.
# - generar, sin secretos ni permisos de escritura, instala el pipeline, descarga y valida los
#   datos y sube como artefacto el parche de data/ y el resumen. Es el único job que procesa datos
#   externos (PDF, JSON, HTML).
# - publicar crea el token de la App en un runner limpio, aplica el parche solo si toca archivos
#   de data/ y nada más, y hace commit, push, PR e issues. No instala dependencias ni corre nada
#   que venga de generar.
# - estado-kv escribe el estado de cada dataset en KV con el token de Cloudflare.
# Los jobs con secretos corren solo desde main; los del bot, en el Environment datos.
jobs:
  preparar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: datos
    permissions: {}
    outputs:
      tiene_bot: ${{ steps.bot.outputs.tiene_bot }}
      grupo: ${{ steps.grupo.outputs.grupo }}
      ids: ${{ steps.grupo.outputs.ids }}
      carpetas: ${{ steps.grupo.outputs.carpetas }}
    steps:
      - name: Comprobar secretos del bot
        id: bot
        env:
          TIENE_BOT: ${{ secrets.BOT_CLIENT_ID != '' && secrets.BOT_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          echo "tiene_bot=${TIENE_BOT}" >> "${GITHUB_OUTPUT}"
          if [ "${TIENE_BOT}" != "true" ]; then
            echo "::notice::Faltan los secretos BOT_CLIENT_ID y BOT_PRIVATE_KEY; no se actualizan datos. Ver ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operacion/bot-de-datos.md"
          fi

      - name: Resolver grupo de datos
        id: grupo
        if: steps.bot.outputs.tiene_bot == 'true'
        env:
          DATASET_ENTRADA: ${{ github.event.inputs.dataset }}
          CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -n "${DATASET_ENTRADA}" ]; then
            grupo="${DATASET_ENTRADA}"
          else
            # Los mismos crons de on.schedule y de concurrency.
            case "${CRON}" in
              "47 11 * * 1") grupo="inegi" ;;
              "47 13 * * *") grupo="bancos" ;;
              "47 18 * * *") grupo="fix" ;;
              "17 20 * * *") grupo="udis" ;;
              "17 22 * * *") grupo="fix" ;;
              *) echo "Cron sin grupo: ${CRON}" >&2; exit 1 ;;
            esac
          fi
          # Los datasets del grupo y sus carpetas en data/: publicar solo acepta un parche dentro
          # de esas carpetas. Una prueba del pipeline (test/workflows.test.ts) las compara con el
          # registro de datasets.
          case "${grupo}" in
            inegi) ids="inegi.estados inegi.municipios"; carpetas="inegi-estados inegi-municipios" ;;
            bancos) ids="bancos"; carpetas="bancos" ;;
            fix) ids="tipo-cambio.fix"; carpetas="tipo-cambio-fix" ;;
            udis) ids="udis"; carpetas="udis" ;;
            *) echo "Grupo no válido: ${grupo}" >&2; exit 1 ;;
          esac
          {
            echo "grupo=${grupo}"
            echo "ids=${ids}"
            echo "carpetas=${carpetas}"
          } >> "${GITHUB_OUTPUT}"

  generar:
    needs: preparar
    if: needs.preparar.outputs.tiene_bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      codigo: ${{ steps.cli.outputs.codigo }}
      cambios: ${{ steps.parche.outputs.cambios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Sin caché de pnpm: este job procesa datos externos y no guarda nada que lean otros
      # workflows.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instalar y compilar
        run: |
          set -euo pipefail
          # Solo el pipeline y lo que usa (el núcleo): el bot no necesita wrangler ni workerd.
          pnpm install --frozen-lockfile --filter "@mexicoapi/pipeline..."
          pnpm --filter "@mexicoapi/pipeline..." build

      - name: Actualizar datos
        id: cli
        env:
          IDS: ${{ needs.preparar.outputs.ids }}
          CORRIDA: ${{ runner.temp }}/corrida
        run: |
          set -uo pipefail
          # GitHub corre bash con -e; el || evita abortar con los códigos 1 y 3.
          codigo=0
          # El CLI imprime textos de las fuentes: mientras corre, el runner no interpreta comandos
          # de workflow (líneas que empiezan con ::).
          pausa="$(openssl rand -hex 16)"
          echo "::stop-commands::${pausa}"
          # IDS son varios argumentos: se deja sin comillas a propósito.
          # shellcheck disable=SC2086
          node packages/pipeline/dist/bin.js actualizar ${IDS} --resumen "${CORRIDA}/resumen" || codigo=$?
          echo "::${pausa}::"
          echo "codigo=${codigo}" >> "${GITHUB_OUTPUT}"

      # El parche lleva todo lo que cambió en data/, incluidos los archivos nuevos y los binarios
      # (el PDF de Banxico). --no-renames: cada ruta sale tal cual, y publicar rechaza renombres.
      # --no-textconv y --no-ext-diff: ninguna configuración de git cambia el contenido del parche
      # (Git para Windows, por ejemplo, convierte los PDF en texto y los deja fuera).
      - name: Armar el parche de data/
        id: parche
        if: steps.cli.outputs.codigo != ''
        env:
          CORRIDA: ${{ runner.temp }}/corrida
        run: |
          set -euo pipefail
          mkdir -p "${CORRIDA}"
          git add -A -- data/
          git diff --cached --binary --no-renames --no-textconv --no-ext-diff --full-index -- data/ \
            > "${CORRIDA}/datos.patch"
          if [ -s "${CORRIDA}/datos.patch" ]; then
            echo "cambios=si" >> "${GITHUB_OUTPUT}"
            git diff --cached --stat -- data/
          else
            echo "cambios=no" >> "${GITHUB_OUTPUT}"
            echo "Sin cambios en data/."
          fi

      # Un solo artefacto con el resumen (resumen.json lo lee estado-kv) y el parche. Si el CLI
      # falló antes de escribir el resumen, el artefacto solo lleva el parche vacío.
      - name: Guardar el resumen y el parche
        if: steps.cli.outputs.codigo != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resumen
          path: ${{ runner.temp }}/corrida/
          if-no-files-found: error
          retention-days: 1
          # Al volver a correr el job, reemplaza el de la corrida anterior.
          overwrite: true

  # Corre si hay algo que publicar o que reportar: cambios en data/, un código distinto de 0 o
  # una falla de generar, antes o después del CLI. Sin cambios, con código 0 y generar en verde no
  # hace falta el token.
  publicar:
    needs: [preparar, generar]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.preparar.result == 'success' && needs.preparar.outputs.tiene_bot == 'true'
      && (needs.generar.result != 'success' || needs.generar.outputs.cambios == 'si'
        || needs.generar.outputs.codigo != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: datos
    permissions:
      contents: read
    outputs:
      # Si la corrida publicó sus cambios: last_success de un dataset actualizado solo avanza así.
      # Con el código 3, o con un parche sobre el umbral del grupo o con binarios que no son el PDF,
      # el PR lleva la etiqueta revisar y no se fusiona solo: no cuenta.
      publicado: ${{ steps.publicar.outcome == 'success' && needs.generar.outputs.codigo == '0' && steps.aplicar.outputs.grande != 'si' && steps.aplicar.outputs.binarios == '' && 'si' || 'no' }}
    steps:
      # El mismo commit de main que usó generar, que armó el parche sobre él. Sin dependencias:
      # este job solo usa git, gh y jq del runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Con generar en rojo no se baja nada: un artefacto de un intento anterior de la corrida no
      # debe tomarse por el de este. Solo se reporta la falla.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.generar.result == 'success'
        with:
          name: resumen
          path: ${{ runner.temp }}/corrida

      # El parche viene de generar, que procesó datos externos: se aplica solo si toca archivos
      # comunes de las carpetas del grupo (las de preparar, que no corre código del repo ni de las
      # fuentes). Cualquier otra cosa detiene la corrida y el paso de fallas abre el issue. Con el
      # código 1 no se publica nada, así que tampoco se aplica.
      #
      # Además, ya aplicado, cuenta las líneas y los bytes que cambia (en el índice, solo git del
      # runner: un texto enviado como parche binario cuenta igual) y, si pasan del umbral del grupo
      # o hay un binario que no es el PDF de participantes (o el PDF pasa de 5 MB), publicar abre
      # el PR con la etiqueta revisar y sin auto-merge aunque generar diga que no hace falta:
      # generar procesó datos externos y no decide solo. Los umbrales dejan margen sobre lo más que
      # cambia una corrida que no pide revisión, con su manifiesto y sus crudos: 31 FIX nuevos son
      # unas 140 líneas; 45 UDIS, 200; 12 municipios (el 0.5 %), 220, y 3 cambios en bancos, unas
      # 50. En bytes cuentan sobre todo los crudos de una sola línea: los del SIDOF, de 20 a 30 KB
      # (una corrida cambia uno o dos), y los 32 de INEGI, unos 470 KB.
      - name: Revisar y aplicar el parche
        id: aplicar
        if: >-
          needs.generar.result == 'success' && needs.generar.outputs.cambios == 'si'
          && needs.generar.outputs.codigo != '1'
        env:
          PARCHE: ${{ runner.temp }}/corrida/datos.patch
          CARPETAS: ${{ needs.preparar.outputs.carpetas }}
          GRUPO: ${{ needs.preparar.outputs.grupo }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          git config core.hooksPath /dev/null
          if [ -z "${CARPETAS}" ]; then
            echo "::error::Falta la lista de carpetas del grupo."
            exit 1
          fi
          # Umbral por grupo en líneas y en bytes (un JSON de una sola línea cambia pocas líneas y
          # muchos bytes). Ver el comentario del paso.
          case "${GRUPO}" in
            inegi) limite=400; limite_bytes=2097152 ;;
            bancos) limite=300; limite_bytes=262144 ;;
            fix) limite=300; limite_bytes=262144 ;;
            udis) limite=400; limite_bytes=262144 ;;
            *) echo "::error::El grupo no tiene umbral de líneas."; exit 1 ;;
          esac
          # El único binario que arma generar, con un tope: el real ronda los 400 KB.
          pdf="data/bancos/raw/participantes-spei.pdf"
          tope_pdf=5242880
          # Una ruta vale si está en una carpeta del grupo, solo lleva letras ASCII, dígitos y
          # . _ / - (nada de espacios, controles ni saltos de línea), y ningún componente está
          # vacío ni empieza con punto (., .., .git, archivos ocultos). La misma regla está en
          # solo-datos de ci.yml; una prueba del pipeline revisa que sean iguales.
          patron="^data/(${CARPETAS// /|})/[A-Za-z0-9._/-]+$"
          ruta_valida() {
            [[ "$1" =~ ${patron} ]] || return 1
            case "/$1/" in
              */.* | *//*) return 1 ;;
            esac
          }
          # git con la salida de error en un archivo: si falla, cada línea sale escapada y con
          # prefijo, para que nada del parche llegue crudo al log (una línea que empieza con ::
          # sería un comando del runner).
          errores_git="${RUNNER_TEMP}/errores-git"
          git_o_falla() {
            if ! git "$@" 2> "${errores_git}"; then
              echo "::error::git $1 falló con el parche." >&2
              while IFS= read -r linea || [ -n "${linea}" ]; do
                printf 'git: %q\n' "${linea}" >&2
              done < "${errores_git}"
              exit 1
            fi
          }
          # Un artefacto puede traer un enlace simbólico: solo se lee un archivo común.
          if [ ! -f "${PARCHE}" ] || [ -L "${PARCHE}" ]; then
            echo "::error::El parche no es un archivo común."
            exit 1
          fi
          if [ ! -s "${PARCHE}" ]; then
            echo "::error::generar marcó cambios, pero el parche está vacío."
            exit 1
          fi
          mal=0
          # Rutas, antes de aplicar y antes de que otro comando de git las imprima. --numstat -z
          # da "añadidas<TAB>borradas<TAB>ruta" por registro, sin comillas ni escapes. En un
          # renombre o una copia solo trae la ruta nueva: esos se rechazan abajo con --summary
          # (generar arma el parche con --no-renames).
          rutas="${RUNNER_TEMP}/rutas-parche"
          git_o_falla apply --numstat -z "${PARCHE}" > "${rutas}"
          # Solo el PDF de participantes de bancos llega como binario: un parche binario en otro
          # archivo (generar arma el parche con git diff --binary, que solo lo usa en binarios)
          # pide revisión.
          binarios=""
          anotar_binario() {
            if [ "$1" != "${pdf}" ] && [[ " ${binarios} " != *" $1 "* ]]; then
              binarios="${binarios:+${binarios} }$1"
            fi
          }
          n=0
          while IFS= read -r -d '' registro; do
            n=$((n + 1))
            agregadas="${registro%%$'\t'*}"
            ruta="${registro#*$'\t'}"
            ruta="${ruta#*$'\t'}"
            if ! ruta_valida "${ruta}"; then
              printf '::error::Ruta no permitida en el parche: %q\n' "${ruta}"
              mal=1
            elif [ "${agregadas}" = "-" ]; then
              anotar_binario "${ruta}"
            fi
          done < "${rutas}"
          if [ "${n}" -eq 0 ]; then
            echo "::error::El parche no lista ninguna ruta."
            mal=1
          fi
          # Ni renombres ni copias, ni enlaces simbólicos (120000) ni submódulos (160000).
          resumen_parche="${RUNNER_TEMP}/resumen-parche"
          git_o_falla apply --summary "${PARCHE}" > "${resumen_parche}"
          if grep -qE '^ (rename|copy) ' "${resumen_parche}"; then
            echo "::error::El parche renombra o copia archivos."
            mal=1
          fi
          if grep -qE ' (120000|160000) ' "${resumen_parche}"; then
            echo "::error::El parche crea un enlace simbólico o un submódulo."
            mal=1
          fi
          if [ "${mal}" -ne 0 ]; then
            exit 1
          fi
          # nowarn: los avisos de espacios repiten líneas del parche.
          git_o_falla apply --check --whitespace=nowarn "${PARCHE}"
          git_o_falla apply --index --whitespace=nowarn "${PARCHE}"
          # Lo que quedó en el índice, otra vez: mismas rutas y solo archivos comunes o borrados.
          indice="${RUNNER_TEMP}/indice-parche"
          git diff --cached --raw --no-renames -z > "${indice}"
          while IFS= read -r -d '' meta && IFS= read -r -d '' ruta; do
            modo="${meta#:* }"
            modo="${modo%% *}"
            if ! ruta_valida "${ruta}"; then
              printf '::error::Quedó una ruta no permitida: %q\n' "${ruta}"
              mal=1
            fi
            case "${modo}" in
              100644 | 100755 | 000000) ;;
              *) printf '::error::Modo no permitido (%s) en %q\n' "${modo}" "${ruta}"; mal=1 ;;
            esac
          done < "${indice}"
          if [ "${mal}" -ne 0 ]; then
            exit 1
          fi
          # Las líneas y los bytes, sobre lo que quedó en el índice y no sobre el parche: un archivo
          # de texto enviado como parche binario cuenta igual. Sin atributos ni filtros de diff: el
          # contenido decide qué es binario. Un binario trae - y no suma líneas.
          cuenta="${RUNNER_TEMP}/lineas-parche"
          git -c core.attributesFile=/dev/null diff --cached --numstat -z --no-renames \
            --no-textconv --no-ext-diff > "${cuenta}"
          lineas=0
          while IFS= read -r -d '' registro; do
            agregadas="${registro%%$'\t'*}"
            ruta="${registro#*$'\t'}"
            quitadas="${ruta%%$'\t'*}"
            ruta="${ruta#*$'\t'}"
            if [[ "${agregadas}" =~ ^[0-9]+$ && "${quitadas}" =~ ^[0-9]+$ ]]; then
              lineas=$((lineas + agregadas + quitadas))
            else
              anotar_binario "${ruta}"
            fi
          done < "${cuenta}"
          # Bytes de las líneas que quitan o agregan (sin los encabezados), en todo menos el PDF.
          bytes="$(git -c core.attributesFile=/dev/null diff --cached -U0 --text --no-renames \
            --no-textconv --no-ext-diff -- . ":(exclude)${pdf}" \
            | { grep -E '^[-+]' || true; } \
            | { grep -vE '^(--- (a/|/dev/null)|\+\+\+ (b/|/dev/null))' || true; } \
            | wc -c)"
          # El PDF, si cambió, con su tope; más grande pide revisión como un binario inesperado.
          # (Cambió si su blob en el índice no es el de HEAD.)
          pdf_nuevo="$(git rev-parse -q --verify ":${pdf}" || true)"
          pdf_antes="$(git rev-parse -q --verify "HEAD:${pdf}" || true)"
          if [ -n "${pdf_nuevo}" ] && [ "${pdf_nuevo}" != "${pdf_antes}" ] \
            && [ "$(git cat-file -s "${pdf_nuevo}")" -gt "${tope_pdf}" ]; then
            binarios="${binarios:+${binarios} }${pdf}"
            echo "::warning::El PDF de participantes pasa de ${tope_pdf} bytes."
          fi
          grande=no
          if [ "${lineas}" -gt "${limite}" ] || [ "${bytes}" -gt "${limite_bytes}" ]; then
            grande=si
            echo "::warning::El parche cambia ${lineas} líneas y ${bytes} bytes de data/, más que el umbral de ${GRUPO} (${limite} líneas o ${limite_bytes} bytes): el PR pide revisión."
          else
            echo "El parche cambia ${lineas} líneas y ${bytes} bytes de data/ (umbral de ${GRUPO}: ${limite} líneas, ${limite_bytes} bytes)."
          fi
          if [ -n "${binarios}" ]; then
            echo "::warning::El parche trae binarios que no se esperan (${binarios}): el PR pide revisión."
          fi
          {
            echo "grande=${grande}"
            echo "lineas=${lineas}"
            echo "limite=${limite}"
            echo "bytes=${bytes}"
            echo "limite_bytes=${limite_bytes}"
            echo "binarios=${binarios}"
          } >> "${GITHUB_OUTPUT}"

      # Se crea aunque un paso anterior haya fallado: el paso de fallas lo usa para abrir el issue.
      - name: Token de la GitHub App
        id: app
        if: ${{ !cancelled() }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Publicar resultado
        id: publicar
        if: needs.generar.result == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GRUPO: ${{ needs.preparar.outputs.grupo }}
          CODIGO: ${{ needs.generar.outputs.codigo }}
          PARCHE_GRANDE: ${{ steps.aplicar.outputs.grande }}
          PARCHE_LINEAS: ${{ steps.aplicar.outputs.lineas }}
          PARCHE_LIMITE: ${{ steps.aplicar.outputs.limite }}
          PARCHE_BYTES: ${{ steps.aplicar.outputs.bytes }}
          PARCHE_LIMITE_BYTES: ${{ steps.aplicar.outputs.limite_bytes }}
          PARCHE_BINARIOS: ${{ steps.aplicar.outputs.binarios }}
          GH_REPO: ${{ github.repository }}
          CORRIDA: ${{ runner.temp }}/corrida
        run: |
          set -euo pipefail
          if [ -z "${APP_SLUG}" ]; then
            echo "::error::Falta el nombre de la App."
            exit 1
          fi
          # Ni el commit, ni el switch ni el push corren hooks del repo. El job verificacion del
          # PR (que exige el check verify) cubre biome y gitleaks.
          git config core.hooksPath /dev/null
          resumen_md="${CORRIDA}/resumen.md"
          resumen_json="${CORRIDA}/resumen.json"
          url_corrida="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fecha="$(TZ=America/Mexico_City date +%F)"

          # Un artefacto puede traer un enlace simbólico: solo se leen archivos comunes.
          es_archivo() {
            [ -f "$1" ] && [ ! -L "$1" ]
          }

          # Abre un issue con el título exacto o, si ya hay uno abierto de la App, comenta en él (un
          # issue con ese título abierto por otra cuenta no cuenta). Si la búsqueda falla, devuelve
          # error sin crear nada: llamada con `|| …`, errexit no corre dentro de la función y sin
          # este return abriría un issue repetido.
          abrir_o_comentar() {
            local titulo="$1" cuerpo="$2" numero
            numero="$(gh issue list --state open --limit 100 --author "app/${APP_SLUG}" \
              --search "in:title \"${titulo}\"" --json number,title \
              | jq -r --arg t "${titulo}" '[.[] | select(.title == $t)][0].number // empty')" \
              || return 1
            if [ -n "${numero}" ]; then
              gh issue comment "${numero}" --body-file "${cuerpo}"
            else
              gh issue create --title "${titulo}" --body-file "${cuerpo}"
            fi
          }

          # El resumen en Markdown que armó generar, dentro de un bloque de código: lo escribió un
          # job que procesa datos externos, así que nada de su texto se interpreta (encabezados,
          # enlaces, imágenes, `Closes #N`). La cerca es más larga que cualquier racha de backticks
          # del texto, así que ninguna línea la cierra; además ninguna @ queda como mención ni un #
          # seguido de un número como referencia (se les agrega un espacio de ancho cero). Si ya
          # con esos espacios pasa de 60 000 bytes (el cuerpo de un PR admite 65 536 caracteres),
          # queda solo el aviso.
          resumen() {
            local bytes largo cerca seguro="${RUNNER_TEMP}/resumen-seguro.md"
            if ! es_archivo "${resumen_md}"; then
              echo "La corrida no dejó resumen."
              return 0
            fi
            sed -e 's/@/@\xe2\x80\x8b/g' -e 's/#\([0-9]\)/#\xe2\x80\x8b\1/g' "${resumen_md}" > "${seguro}"
            bytes="$(wc -c < "${seguro}")"
            if [ "${bytes}" -gt 60000 ]; then
              echo "El resumen de la corrida pasa de 60 000 bytes (${bytes}): no se copia aquí."
              return 0
            fi
            largo="$(awk '{ while (match($0, /`+/)) { if (RLENGTH > n) n = RLENGTH; $0 = substr($0, RSTART + RLENGTH) } } END { print n + 1 }' "${seguro}")"
            if [ "${largo}" -lt 3 ]; then
              largo=3
            fi
            cerca="$(printf '%*s' "${largo}" '' | tr ' ' '`')"
            echo "${cerca}text"
            cat "${seguro}"
            if [ -n "$(tail -c 1 "${seguro}")" ]; then
              echo
            fi
            echo "${cerca}"
          }

          # Motivos y errores del resumen JSON, en un bloque de código y una línea por elemento:
          # los saltos y controles pasan a espacio (ninguna línea puede cerrar el bloque) y las @
          # no mencionan a nadie. Con un parche sobre el umbral, ese motivo va primero.
          motivos() {
            local lista="${RUNNER_TEMP}/motivos.txt"
            : > "${lista}"
            if [ "${PARCHE_GRANDE}" = "si" ]; then
              echo "- el parche cambia ${PARCHE_LINEAS} líneas y ${PARCHE_BYTES} bytes de data/, más que el umbral del grupo (${PARCHE_LIMITE} líneas o ${PARCHE_LIMITE_BYTES} bytes)" >> "${lista}"
            fi
            if [ -n "${PARCHE_BINARIOS}" ]; then
              echo "- el parche trae binarios que no se esperan (otros que el PDF de participantes, o el PDF de más de 5 MB): ${PARCHE_BINARIOS}" >> "${lista}"
            fi
            if es_archivo "${resumen_json}"; then
              jq -r 'def linea: tostring | gsub("[[:cntrl:]\u2028\u2029]+"; " ") | gsub("@"; "@\u200b");
                (.resultados[]?.motivos[]? | "- " + linea),
                (.errores[]? | "- \(.dataset | linea): \(.mensaje | linea)")' "${resumen_json}" >> "${lista}"
            fi
            if [ -s "${lista}" ]; then
              echo '```text'
              cat "${lista}"
              echo '```'
            fi
          }

          if [ "${CODIGO}" = "1" ]; then
            cuerpo="${RUNNER_TEMP}/issue-falla.md"
            {
              echo "La corrida de datos de \`${GRUPO}\` falló y no se escribió nada en \`data/\`."
              echo
              motivos
              echo
              echo "Corrida: ${url_corrida}"
            } > "${cuerpo}"
            abrir_o_comentar "Falla en datos: ${GRUPO}" "${cuerpo}"
            echo "::error::El pipeline terminó con error (código 1)."
            exit 1
          fi

          if [ "${CODIGO}" != "0" ] && [ "${CODIGO}" != "3" ]; then
            echo "::error::Código de salida inesperado: ${CODIGO}"
            exit 1
          fi

          # Con el código 3, o con un parche sobre el umbral del grupo o con binarios que no son el
          # PDF (paso anterior), el PR lleva la etiqueta revisar y no se fusiona solo.
          pide_revision=no
          if [ "${CODIGO}" = "3" ] || [ "${PARCHE_GRANDE}" = "si" ] || [ -n "${PARCHE_BINARIOS}" ]; then
            pide_revision=si
          fi

          # El paso anterior dejó en el índice los cambios del parche, si los había.
          if git diff --cached --quiet -- data/; then
            if [ "${CODIGO}" = "3" ]; then
              cuerpo="${RUNNER_TEMP}/issue-revisar.md"
              {
                echo "La corrida de \`${GRUPO}\` pide revisión humana y no cambió \`data/\`."
                echo
                motivos
                echo
                echo "Corrida: ${url_corrida}"
              } > "${cuerpo}"
              abrir_o_comentar "Revisar datos: ${GRUPO}" "${cuerpo}"
            else
              echo "Sin cambios en data/."
            fi
            exit 0
          fi

          # Si el bot ya tiene un PR abierto para este grupo (con o sin etiqueta), no se abre otro:
          # se comenta en él. Solo cuentan ramas del propio repo, no de forks.
          pr_pendiente="$(gh pr list --state open --author "app/${APP_SLUG}" --limit 100 \
            --json url,headRefName,isCrossRepository \
            | jq -r --arg p "datos/${GRUPO}-" \
              '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith($p)))][0].url // empty')"
          if [ -n "${pr_pendiente}" ]; then
            cuerpo="${RUNNER_TEMP}/pr-pendiente.md"
            {
              echo "Una corrida nueva de \`${GRUPO}\` trae cambios, pero este PR sigue abierto, así que no se abrió otro."
              echo
              resumen
              echo
              echo "Corrida: ${url_corrida}"
            } > "${cuerpo}"
            gh pr comment "${pr_pendiente}" --body-file "${cuerpo}"
            # Avisa si el PR lleva más de 48 horas abierto o tiene algún check en rojo. Si la API
            # falla aquí, solo queda un aviso: el paso sigue y el issue de revisión de abajo se abre.
            if estado_pr="$(gh pr view "${pr_pendiente}" --json createdAt,statusCheckRollup)" \
              && atasco="$(jq -r --argjson ahora "$(date -u +%s)" '
              [ (if any(.statusCheckRollup[]?;
                    ((.conclusion // "") | IN("FAILURE", "TIMED_OUT", "CANCELLED", "ACTION_REQUIRED", "STARTUP_FAILURE"))
                    or ((.state // "") | IN("FAILURE", "ERROR")))
                 then "CI en rojo" else empty end),
                (if ($ahora - (.createdAt | fromdateiso8601)) > 172800
                 then "más de 48 horas abierto" else empty end)
              ] | join(" y ")' <<< "${estado_pr}")"; then
              if [ -n "${atasco}" ]; then
                cuerpo="${RUNNER_TEMP}/issue-atascado.md"
                {
                  echo "El PR ${pr_pendiente} está atascado: ${atasco}."
                  echo
                  echo "Corrida: ${url_corrida}"
                } > "${cuerpo}"
                abrir_o_comentar "PR de datos atascado: ${GRUPO}" "${cuerpo}" \
                  || echo "::warning::No se pudo abrir el issue del PR atascado ${pr_pendiente}."
              fi
            else
              echo "::warning::No se pudo revisar si el PR ${pr_pendiente} está atascado."
            fi
            if [ "${pide_revision}" = "si" ]; then
              cuerpo="${RUNNER_TEMP}/issue-pendiente.md"
              {
                echo "Hay cambios nuevos en \`${GRUPO}\` que piden revisión humana, pero el PR ${pr_pendiente} sigue abierto, así que no se abrió otro."
                echo
                motivos
                echo
                echo "Corrida: ${url_corrida}"
              } > "${cuerpo}"
              abrir_o_comentar "Revisar datos: ${GRUPO}" "${cuerpo}"
            fi
            exit 0
          fi

          # git pide las credenciales a gh, que las toma de GH_TOKEN en este paso: el token no
          # va en la URL ni queda en .git/config.
          gh auth setup-git

          # Identidad del bot
          id_bot="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id_bot}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Rama del día; si ya existe en el remoto, se agrega un sufijo.
          rama="datos/${GRUPO}-${fecha}"
          n=2
          while git ls-remote --exit-code --heads origin "${rama}" > /dev/null 2>&1; do
            rama="datos/${GRUPO}-${fecha}-${n}"
            n=$((n + 1))
          done

          git switch -c "${rama}"
          # Los hooks ya están apagados desde el inicio del paso; además, el commit no ve el token.
          env -u GH_TOKEN git commit -q -m "datos(${GRUPO}): ${fecha}"
          git push origin "${rama}"

          cuerpo_pr="${RUNNER_TEMP}/pr.md"
          {
            resumen
            echo
            echo "Corrida: ${url_corrida}"
          } > "${cuerpo_pr}"

          if [ "${pide_revision}" = "si" ]; then
            url_pr="$(gh pr create --base main --head "${rama}" --title "datos(${GRUPO}): ${fecha}" \
              --body-file "${cuerpo_pr}" --label revisar)"
            cuerpo="${RUNNER_TEMP}/issue-revisar.md"
            {
              echo "El PR ${url_pr} pide revisión humana y no se fusiona solo."
              echo
              motivos
              echo
              echo "Corrida: ${url_corrida}"
            } > "${cuerpo}"
            abrir_o_comentar "Revisar datos: ${GRUPO} ${fecha}" "${cuerpo}"
          else
            url_pr="$(gh pr create --base main --head "${rama}" --title "datos(${GRUPO}): ${fecha}" \
              --body-file "${cuerpo_pr}")"
            gh pr merge "${url_pr}" --auto --rebase
          fi

      # Una falla de generar (antes o después del CLI), del parche o de la publicación. Con el
      # código 1 el paso de publicar ya abrió el issue con los motivos.
      - name: Reportar falla
        if: >-
          !cancelled() && steps.app.outputs.token != ''
          && (needs.generar.result != 'success'
            || (failure() && !(needs.generar.outputs.codigo == '1' && steps.publicar.outcome == 'failure')))
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_REPO: ${{ github.repository }}
          GRUPO: ${{ needs.preparar.outputs.grupo }}
        run: |
          set -euo pipefail
          if [ -z "${APP_SLUG}" ]; then
            echo "::error::Falta el nombre de la App."
            exit 1
          fi
          url_corrida="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          titulo="Falla en datos: ${GRUPO}"
          cuerpo="${RUNNER_TEMP}/issue-falla-previa.md"
          {
            echo "La corrida de datos de \`${GRUPO}\` falló (instalación, compilación, armado o revisión del parche de \`data/\`, o publicación)."
            echo
            echo "Corrida: ${url_corrida}"
          } > "${cuerpo}"
          # Solo cuenta un issue abierto por la App: uno con ese título de otra cuenta no.
          numero="$(gh issue list --state open --limit 100 --author "app/${APP_SLUG}" \
            --search "in:title \"${titulo}\"" --json number,title \
            | jq -r --arg t "${titulo}" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "${numero}" ]; then
            gh issue comment "${numero}" --body-file "${cuerpo}"
          else
            gh issue create --title "${titulo}" --body-file "${cuerpo}"
          fi
          # Si generar falló, la corrida ya queda en rojo por generar; aquí no se agrega otra falla.

  # Deja el estado de cada dataset en KV para /v1/status. Va en un job aparte, sin instalar
  # dependencias ni tocar datos externos, para que el token de Cloudflare no conviva con esos
  # pasos. Solo desde main (como el despliegue) y sin cambiar el resultado de la corrida de datos.
  # Si generar no terminó en verde, antes o después del CLI, no se escribe nada: el resumen de
  # un intento anterior de la corrida no debe tomarse por el de este. La falla la reporta publicar.
  estado-kv:
    needs: [generar, publicar]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.generar.result == 'success' && needs.generar.outputs.codigo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produccion
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - name: Comprobar secretos de Cloudflare
        id: cf
        env:
          TIENE_CF: ${{ secrets.CLOUDFLARE_KV_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          echo "tiene_cf=${TIENE_CF}" >> "${GITHUB_OUTPUT}"
          if [ "${TIENE_CF}" != "true" ]; then
            echo "::notice::Faltan los secretos de Cloudflare (CLOUDFLARE_KV_TOKEN y CLOUDFLARE_ACCOUNT_ID); no se escribe el estado en KV. Ver ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/operacion/cloudflare.md"
          fi

      # cloudflare.ts no tiene dependencias: basta su carpeta (el modo cono trae además los
      # archivos de la raíz, como .nvmrc, y apps/api/package.json, que lo marca como módulo).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cf.outputs.tiene_cf == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: apps/api/scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cf.outputs.tiene_cf == 'true'
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.cf.outputs.tiene_cf == 'true'
        with:
          name: resumen
          path: ${{ runner.temp }}/resumen

      - name: Escribir estado en KV
        if: steps.cf.outputs.tiene_cf == 'true'
        env:
          # El token propio de KV (solo Workers KV Storage: Edit), nunca el de despliegue.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CODIGO: ${{ needs.generar.outputs.codigo }}
          # Sin cambios y con código 0 publicar no corre: todos los datasets quedaron sin_cambios
          # y publicado no cambia su estado.
          PUBLICADO: ${{ needs.publicar.outputs.publicado == 'si' && 'si' || 'no' }}
          RESUMEN: ${{ runner.temp }}/resumen/resumen.json
        run: |
          set -euo pipefail
          # Un artefacto puede traer un enlace simbólico: solo se lee un archivo común.
          if [ ! -f "${RESUMEN}" ] || [ -L "${RESUMEN}" ]; then
            echo "::error::resumen.json no es un archivo común."
            exit 1
          fi
          node apps/api/scripts/cloudflare.ts estado --resumen "${RESUMEN}" --codigo "${CODIGO}" --publicado "${PUBLICADO}"

      - name: Avisar si no se escribió el estado
        if: failure() && steps.cf.outputs.tiene_cf == 'true'
        run: |
          set -euo pipefail
          echo "::warning::No se pudo escribir el estado en KV; /v1/status puede mostrar datos atrasados."
